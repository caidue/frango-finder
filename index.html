<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frango Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Points you to the nearest chicken restaurant.">
  <meta name="theme-color" content="#ffcf1a">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Frango">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
  <main id="stage" aria-live="polite">
    <div class="arrow-shadow">
      <svg id="arrow" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="50,3 90,45 67,45 67,97 33,97 33,45 10,45"/>
      </svg>
    </div>

    <div class="medallion">
      <img src="chicken.jpeg" alt="Chicken" draggable="false">
    </div>

    <p id="status"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>

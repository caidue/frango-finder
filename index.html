<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frango Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Points you to the nearest chicken restaurant.">
  <meta name="theme-color" content="#ffcf1a">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Frango">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
  <main id="stage" aria-live="polite">
    <div class="arrow-shadow">
      <svg id="arrow" viewBox="0 0 100 100" aria-hidden="true">
        <!-- A chicken seen from above, running forward: the beak is the tip,
             the swept-back wings are the arrowhead, the tail is the fletching. -->
        <g class="ck-tail">
          <ellipse cx="50" cy="87" rx="5.5" ry="10.5" transform="rotate(-30 50 76)"/>
          <ellipse cx="50" cy="87" rx="5.5" ry="10.5" transform="rotate(30 50 76)"/>
          <ellipse cx="50" cy="87.5" rx="5.5" ry="10.5"/>
        </g>
        <path class="ck-wing" d="M39,27 L5,52 Q8,60 17,57 Q16,65 25,62 Q25,70 35,65 Z"/>
        <path class="ck-wing" transform="translate(100 0) scale(-1 1)" d="M39,27 L5,52 Q8,60 17,57 Q16,65 25,62 Q25,70 35,65 Z"/>
        <ellipse class="ck-body" cx="50" cy="53" rx="20" ry="27"/>
        <polygon class="ck-beak" points="50,1 41.5,15 58.5,15"/>
        <circle class="ck-body" cx="50" cy="19.5" r="10.5"/>
        <g class="ck-comb">
          <circle cx="50" cy="25" r="2.8"/>
          <circle cx="50" cy="20" r="2.8"/>
          <circle cx="50" cy="15" r="2.8"/>
        </g>
        <circle class="ck-eye" cx="43.2" cy="17" r="1.5"/>
        <circle class="ck-eye" cx="56.8" cy="17" r="1.5"/>
      </svg>
    </div>

    <div class="medallion">
      <img src="chicken.jpeg" alt="Chicken" draggable="false">
    </div>

    <p id="status"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
